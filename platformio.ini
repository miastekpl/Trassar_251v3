; ============================================================
; TrassarV3 - Komputer pokładowy malowarki pasów drogowych
; Platforma: ESP32-S3 N16R8
; Wersja: 2.23.0
; ============================================================

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Pamiec flash i PSRAM ---
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; --- Monitor szeregowy ---
monitor_speed = 115200
upload_speed = 921600

; --- Biblioteki ---
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.0.3
    links2004/WebSockets@^2.4.1

; --- Konfiguracja TFT_eSPI przez flagi kompilacji ---
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTOUCH_CS=15
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"2.23.0\"
    -Wall
    -Wextra
    -Wno-unused-parameter

; --- Static analysis ---
check_tool = cppcheck
check_flags =
    cppcheck: --enable=all --suppress=missingIncludeSystem

; ============================================================
; Srodowisko native do unit testow (pio test -e native)
; Testuje czysta logike (shouldGunFire, wzorce) bez hardware
; ============================================================
[env:native]
platform = native
build_flags =
    -DUNIT_TEST
    -DFW_VERSION=\"2.23.0\"
    -std=c++17
; Testy sa self-contained — nie kompilujemy plikow z src/
test_build_src = no
